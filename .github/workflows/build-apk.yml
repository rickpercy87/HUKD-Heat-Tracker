name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble Android project
        run: |
          cat chunks/chunk* > android-project.b64
          base64 -d android-project.b64 > android-project.zip
          unzip -q android-project.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: HUKDHeatTrackerAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HUKD-Heat-Tracker-APK
          path: HUKDHeatTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
